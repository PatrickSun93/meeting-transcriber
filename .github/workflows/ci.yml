name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels its older runs, which would only
# hold up the runners (the GPU builds take a while). Release tags always
# run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    # Apple Silicon runner: builds the real app with Metal and ScreenCaptureKit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # screencapturekit's Swift bridge (via apple-metal) needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/bundle-macos.sh
      - name: Zip the app
        run: cd target/release/bundle && ditto -c -k --keepParent "Meeting Transcriber.app" Meeting-Transcriber-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-macOS
          path: target/release/bundle/Meeting-Transcriber-macOS.zip

  linux:
    # The processor build, plus a Vulkan build in vulkan/ that it starts
    # when the graphics driver has Vulkan; Others is recorded with parec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # ALSA headers for the microphone; CMake and Clang build whisper.cpp
      # and its bindings. The window needs no headers: winit loads X11,
      # Wayland and xkbcommon at run time.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev cmake clang libclang-dev pkg-config libvulkan-dev glslc
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/package-linux.sh --vulkan
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Linux-x86_64
          path: target/release/package/Meeting-Transcriber-Linux-x86_64.tar.gz

  linux-nvidia:
    # The processor build plus a CUDA build in cuda/, with CUDA's runtime
    # libraries: for NVIDIA cards. Tested by the linux job; this one builds.
    runs-on: ubuntu-24.04
    env:
      # Turing to Blackwell, plus PTX for newer cards.
      CUDAARCHS: 75-real;86-real;89-real;120-real;89-virtual
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang libclang-dev pkg-config \
            cuda-nvcc-12-9 cuda-cudart-dev-12-9 cuda-driver-dev-12-9 libcublas-dev-12-9
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo "CUDA_PATH=/usr/local/cuda-12.9" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"
      - run: ./scripts/package-linux.sh --cuda
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Linux-x86_64-NVIDIA
          path: target/release/package/Meeting-Transcriber-Linux-x86_64-NVIDIA.tar.gz

  windows:
    # The processor build with MSVC, plus a Vulkan build in vulkan\ that it
    # starts when the graphics driver has Vulkan; Others is recorded with
    # WASAPI loopback.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList '--root', 'C:\VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The Vulkan build needs Ninja and cl.exe on the PATH (see the script).
      - run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { pip install ninja }
        shell: pwsh
      - uses: ilammy/msvc-dev-cmd@v1
      - run: ./scripts/package-windows.ps1 -Vulkan
        shell: pwsh
        env:
          # Short, or the Vulkan shader tool's paths pass Windows' limit.
          GPU_TARGET_DIR: C:\b
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Windows-x86_64
          path: target/release/package/Meeting-Transcriber-Windows-x86_64.zip

  windows-nvidia:
    # The processor build plus a CUDA build in cuda\, with CUDA's runtime
    # DLLs: for NVIDIA cards. Tested by the windows job; this one builds.
    # Visual Studio 2022: CUDA 12's build rules have no toolset for the
    # newer Visual Studio on windows-latest ("No CUDA toolset found").
    runs-on: windows-2022
    env:
      CUDAARCHS: 75-real;86-real;89-real;120-real;89-virtual
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - run: ./scripts/package-windows.ps1 -Cuda
        shell: pwsh
        env:
          GPU_TARGET_DIR: C:\b
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Windows-x86_64-NVIDIA
          path: target/release/package/Meeting-Transcriber-Windows-x86_64-NVIDIA.zip

  release:
    # Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0)
    # publishes the three packages as a GitHub release, once all three
    # builds and their tests have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, linux-nvidia, windows, windows-nvidia]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          --notes "**The Windows and Linux builds are untested.** They compile and pass
          their unit tests in CI, but have not been run on a real PC yet and may have
          problems. The macOS build is the one in daily use." 
        env:
          GH_TOKEN: ${{ github.token }}
