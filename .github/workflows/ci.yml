name: CI

# Pull requests get the quick checks and the processor packages. The
# graphics-card builds (Vulkan in the packages, the CUDA add-ons) take long,
# so they are built on main, for version tags, when run by hand, and for
# pull requests labelled gpu.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # labeled: adding the gpu label starts a run with the GPU builds.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      gpu:
        description: Also build the graphics-card builds (Vulkan, CUDA add-ons)
        type: boolean
        default: true

# A newer push to the same branch cancels its older runs, which would only
# hold up the runners. Release tags always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Whether this run builds the graphics-card builds (see above).
  GPU: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gpu) || contains(github.event.pull_request.labels.*.name, 'gpu') }}
  # sccache keeps compiled Rust in the Actions cache, so code that did not
  # change is not compiled again; on macOS and Linux also C++ (whisper.cpp)
  # and CUDA (see the jobs: MSVC's shared debug-info files can't be cached).
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache
  # Turing to Blackwell, plus PTX for newer cards (CUDA add-ons).
  CUDAARCHS: 75-real;86-real;89-real;120-real;89-virtual

jobs:
  macos:
    # Apple Silicon runner: builds the real app with Metal and ScreenCaptureKit.
    runs-on: macos-15
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      # screencapturekit's Swift bridge (via apple-metal) needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/bundle-macos.sh
      - name: Zip the app
        run: cd target/release/bundle && ditto -c -k --keepParent "Meeting Transcriber.app" Meeting-Transcriber-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-macOS
          path: target/release/bundle/Meeting-Transcriber-macOS.zip

  linux:
    # The processor build, plus (GPU runs) a Vulkan build in vulkan/ that it
    # starts when the graphics driver has Vulkan; Others is recorded with parec.
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # ALSA headers for the microphone; CMake and Clang build whisper.cpp
      # and its bindings. The window needs no headers: winit loads X11,
      # Wayland and xkbcommon at run time.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev cmake clang libclang-dev pkg-config libvulkan-dev glslc
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/package-linux.sh ${{ env.GPU == 'true' && '--vulkan' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Linux-x86_64
          path: target/release/package/Meeting-Transcriber-Linux-x86_64.tar.gz

  linux-cuda:
    # The CUDA add-on: a CUDA build and CUDA's runtime libraries in cuda/,
    # which the app downloads when it finds an NVIDIA card (src/cuda_addon.rs).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gpu) || contains(github.event.pull_request.labels.*.name, 'gpu')
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang libclang-dev pkg-config \
            cuda-nvcc-12-9 cuda-cudart-dev-12-9 cuda-driver-dev-12-9 libcublas-dev-12-9
          sudo ln -sfn /usr/local/cuda-12.9 /usr/local/cuda
          echo "CUDA_PATH=/usr/local/cuda-12.9" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"
      - run: ./scripts/package-linux.sh --cuda-addon
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Linux-x86_64-CUDA
          path: target/release/package/Meeting-Transcriber-Linux-x86_64-CUDA.zip

  windows:
    # The processor build with MSVC, plus (GPU runs) a Vulkan build in
    # vulkan\ that it starts when the graphics driver has Vulkan; Others is
    # recorded with WASAPI loopback.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Vulkan SDK
        if: env.GPU == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList '--root', 'C:\VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The Vulkan build needs Ninja and cl.exe on the PATH (see the script).
      - if: env.GPU == 'true'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { pip install ninja }
        shell: pwsh
      - if: env.GPU == 'true'
        uses: ilammy/msvc-dev-cmd@v1
      - run: ./scripts/package-windows.ps1 ${{ env.GPU == 'true' && '-Vulkan' || '' }}
        shell: pwsh
        env:
          # Short, or the Vulkan shader tool's paths pass Windows' limit.
          GPU_TARGET_DIR: C:\b
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Windows-x86_64
          path: target/release/package/Meeting-Transcriber-Windows-x86_64.zip

  windows-cuda:
    # The CUDA add-on for Windows: a CUDA build and CUDA's runtime DLLs in
    # cuda\. Visual Studio 2022, which CUDA 12 supports (windows-latest has
    # a newer one).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gpu) || contains(github.event.pull_request.labels.*.name, 'gpu')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - run: ./scripts/package-windows.ps1 -CudaAddon
        shell: pwsh
        env:
          GPU_TARGET_DIR: C:\b
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Windows-x86_64-CUDA
          path: target/release/package/Meeting-Transcriber-Windows-x86_64-CUDA.zip

  release:
    # Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0)
    # publishes the packages and the CUDA add-ons as a GitHub release, once
    # every build and its tests have passed. The app downloads its CUDA
    # add-on from the release of its own version, so the tag must match
    # the version in Cargo.toml.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, linux-cuda, windows, windows-cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release may already be there: publishing one on the Releases
      # page creates the tag, which starts this run. Then the packages are
      # added to it; otherwise the release is made here.
      - name: Publish the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "**The Windows and Linux builds are untested.** They compile and pass their unit tests in CI, but have not been run on a real PC yet and may have problems. The macOS build is the one in daily use. The -CUDA zips are the CUDA add-ons, which the app downloads by itself on a PC with an NVIDIA card."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
