name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    # Apple Silicon runner: builds the real app with Metal and ScreenCaptureKit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # screencapturekit's Swift bridge (via apple-metal) needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/bundle-macos.sh
      - name: Zip the app
        run: cd target/release/bundle && ditto -c -k --keepParent "Meeting Transcriber.app" Meeting-Transcriber-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-macOS
          path: target/release/bundle/Meeting-Transcriber-macOS.zip

  linux:
    # CPU build; Others is recorded from the sound server with parec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # ALSA headers for the microphone; CMake and Clang build whisper.cpp
      # and its bindings. The window needs no headers: winit loads X11,
      # Wayland and xkbcommon at run time.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev cmake clang libclang-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Linux-x86_64
          path: target/release/package/Meeting-Transcriber-Linux-x86_64.tar.gz

  windows:
    # CPU build with MSVC; Others is recorded with WASAPI loopback.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-Windows-x86_64
          path: target/release/package/Meeting-Transcriber-Windows-x86_64.zip

  release:
    # Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0)
    # publishes the three packages as a GitHub release, once all three
    # builds and their tests have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          --notes "**The Windows and Linux builds are untested.** They compile and pass
          their unit tests in CI, but have not been run on a real PC yet and may have
          problems. The macOS build is the one in daily use." 
        env:
          GH_TOKEN: ${{ github.token }}
