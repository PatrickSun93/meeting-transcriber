name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    # Apple Silicon runner: builds the real app with Metal and ScreenCaptureKit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # screencapturekit's Swift bridge (via apple-metal) needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./scripts/bundle-macos.sh
      - name: Launch check (dynamic libraries load, CLI runs)
        run: |
          sw_vers
          BIN="target/release/bundle/Meeting Transcriber.app/Contents/MacOS/meeting-transcriber"
          otool -L "$BIN"
          otool -l "$BIN" | grep -A2 LC_RPATH || true
          "$BIN" --help
      - name: Zip the app
        run: cd target/release/bundle && ditto -c -k --keepParent "Meeting Transcriber.app" Meeting-Transcriber-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Transcriber-macOS
          path: target/release/bundle/Meeting-Transcriber-macOS.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
